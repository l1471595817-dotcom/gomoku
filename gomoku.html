<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>五子棋 · 情侣对战</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1a2e;
  --surface:#16213e;
  --surface2:#0f3460;
  --gold:#e8b830;
  --gold-dim:#c49a20;
  --text:#f0e6d3;
  --text-dim:#a09070;
  --board-wood:#daa84b;
  --board-line:#6b4226;
  --btn-bg:#2a2a4a;
  --btn-hover:#3a3a6a;
  --radius:12px;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
}
html,body{height:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;padding:16px;
  background-image:radial-gradient(ellipse at 20% 50%,#1a1a3e 0%,#0d0d1a 100%);
}
#app{
  background:var(--surface);
  border-radius:var(--radius);
  padding:24px 24px 16px;
  box-shadow:var(--shadow);
  max-width:620px;width:100%;
  text-align:center;
  border:1px solid rgba(232,184,48,0.15);
}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:4px}
header h1{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:2px;cursor:default;user-select:none}
.turn-area{display:flex;align-items:center;gap:10px;font-size:15px}
.turn-dot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;flex-shrink:0}
.turn-dot.black{background:radial-gradient(circle at 35% 35%,#555,#111);border:1px solid #888}
.turn-dot.white{background:radial-gradient(circle at 35% 35%,#fff,#ccc);border:1px solid #999}
#turn-text{font-weight:600}
.score{font-size:14px;color:var(--text-dim);letter-spacing:0.5px}
.score .num{font-weight:700;color:var(--text);font-size:16px}
#board-wrap{
  position:relative;margin:12px auto 0;
  width:100%;aspect-ratio:1/1;max-width:560px;
  border-radius:8px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,0.2),0 4px 20px rgba(0,0,0,0.4);
}
#board-wrap canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none}
.controls{display:flex;gap:10px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.controls button{
  padding:8px 18px;border:none;border-radius:8px;
  background:var(--btn-bg);color:var(--text);
  font-size:14px;cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;gap:6px;
  border:1px solid rgba(255,255,255,0.06);
}
.controls button:hover{background:var(--btn-hover);transform:translateY(-1px)}
.controls button:active{transform:translateY(0);opacity:0.8}
.controls button:disabled{opacity:0.35;cursor:not-allowed;transform:none}
#god-toggle-hint{font-size:11px;color:var(--text-dim);margin:4px 0 0;opacity:0.4;cursor:default;user-select:none;transition:opacity 0.3s}
#god-toggle-hint:hover{opacity:0.7}
#god-panel{
  margin-top:8px;overflow:hidden;max-height:0;
  transition:max-height 0.4s ease,opacity 0.3s ease,transform 0.3s ease;
  opacity:0;transform:translateY(-8px);
  border-radius:10px;background:rgba(232,184,48,0.06);
  border:1px solid rgba(232,184,48,0.12);
}
#god-panel.open{max-height:300px;opacity:1;transform:translateY(0);padding:12px}
.god-header{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:700;color:var(--gold);margin-bottom:10px;
}
.god-header::before,.god-header::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.god-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.god-btns button{
  padding:7px 14px;border:none;border-radius:8px;
  font-size:13px;cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;gap:5px;
  background:rgba(232,184,48,0.12);color:var(--gold);
  border:1px solid rgba(232,184,48,0.2);
}
.god-btns button:hover{background:rgba(232,184,48,0.2);transform:translateY(-1px)}
.god-btns button:active{transform:translateY(0);opacity:0.8}
.god-btns button.active{background:rgba(232,184,48,0.25);box-shadow:0 0 12px rgba(232,184,48,0.15)}
.god-btns button:disabled{opacity:0.3;cursor:not-allowed;transform:none}
#win-overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.65);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity 0.5s ease;
}
#win-overlay.show{opacity:1;pointer-events:auto}
.win-card{
  background:var(--surface);
  border-radius:20px;padding:40px 48px 32px;
  text-align:center;
  border:1px solid rgba(232,184,48,0.2);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  transform:scale(0.85) translateY(20px);
  transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
#win-overlay.show .win-card{transform:scale(1) translateY(0)}
.win-emoji{font-size:56px;margin-bottom:8px;display:block}
.win-text{font-size:26px;font-weight:700;margin-bottom:6px}
.win-sub{font-size:14px;color:var(--text-dim);margin-bottom:20px}
.win-card button{
  padding:10px 32px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold-dim));
  color:#1a1a2e;font-size:16px;font-weight:700;
  cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;
  box-shadow:0 4px 16px rgba(232,184,48,0.3);
}
.win-card button:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(232,184,48,0.4)}
#toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  z-index:200;padding:10px 24px;border-radius:10px;
  font-size:14px;font-weight:600;
  background:rgba(232,184,48,0.15);color:var(--gold);
  border:1px solid rgba(232,184,48,0.25);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.info{background:rgba(72,166,232,0.15);color:#48a6e8;border-color:rgba(72,166,232,0.25)}
#toast.warn{background:rgba(232,120,48,0.15);color:#e87830;border-color:rgba(232,120,48,0.25)}
#toast.success{background:rgba(72,232,120,0.15);color:#48e878;border-color:rgba(72,232,120,0.25)}
footer{font-size:10px;color:var(--text-dim);opacity:0.25;margin-top:6px;user-select:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="game-title"><span>🏆</span> 五子棋</h1>
    <div class="turn-area">
      <span class="turn-dot black" id="turn-dot"></span>
      <span id="turn-text">黑棋走</span>
    </div>
    <div class="score">
      <span>● <span class="num" id="score-black">0</span></span>
      <span style="margin:0 4px;opacity:0.4">:</span>
      <span><span class="num" id="score-white">0</span> ○</span>
    </div>
  </header>
  <div id="board-wrap"><canvas id="board"></canvas></div>
  <div class="controls">
    <button id="btn-restart">🔄 重新开始</button>
    <button id="btn-undo" disabled>↩️ 悔棋</button>
  </div>
  <div id="god-toggle-hint">🔑 连击标题进入秘密模式</div>
  <div id="god-panel">
    <div class="god-header">👑 上帝模式</div>
    <div class="god-btns">
      <button id="god-ai">🤖 AI 替我下</button>
      <button id="god-double">🔁 双倍落子</button>
      <button id="god-remove">🗑️ 移除对手棋子</button>
      <button id="god-swap">🔄 交换黑白</button>
    </div>
  </div>
  <footer>v1.0 · 你和她的五子棋</footer>
</div>
<div id="win-overlay">
  <div class="win-card">
    <span class="win-emoji" id="win-emoji">🎉</span>
    <div class="win-text" id="win-text">黑棋获胜！</div>
    <div class="win-sub" id="win-sub">再来一局吧</div>
    <button id="win-restart">再来一局 🔄</button>
  </div>
</div>
<div id="toast"></div>
<script>
var BOARD_SIZE=15,EMPTY=0,BLACK=1,WHITE=2;
var canvas=document.getElementById("board"),ctx=canvas.getContext("2d");
var turnDot=document.getElementById("turn-dot"),turnText=document.getElementById("turn-text");
var scoreBlack=document.getElementById("score-black"),scoreWhite=document.getElementById("score-white");
var btnRestart=document.getElementById("btn-restart"),btnUndo=document.getElementById("btn-undo");
var godPanel=document.getElementById("god-panel"),godHint=document.getElementById("god-toggle-hint");
var winOverlay=document.getElementById("win-overlay"),winEmoji=document.getElementById("win-emoji");
var winText=document.getElementById("win-text"),winSub=document.getElementById("win-sub");
var winRestart=document.getElementById("win-restart"),toast=document.getElementById("toast");
var godAi=document.getElementById("god-ai"),godDouble=document.getElementById("god-double");
var godRemove=document.getElementById("god-remove"),godSwap=document.getElementById("god-swap");
var gameTitle=document.getElementById("game-title");
var board=[],currentPlayer=BLACK,gameOver=false,winner=null,winningCells=[],lastMove=null,history=[];
var blackScore=0,whiteScore=0,godMode=false,doubleMove=false,doubleMovePending=false;
var titleClicks=0,titleClickTimer=null,wasGodUnlocked=false;
var PADDING,CELL_SIZE,CANVAS_SIZE,dpr=1;

function initBoard(){
  board=Array.from({length:BOARD_SIZE},function(){return Array(BOARD_SIZE).fill(EMPTY)});
  currentPlayer=BLACK;gameOver=false;winner=null;winningCells=[];lastMove=null;history=[];doubleMovePending=false;
  updateUI();drawBoard();
}
function resizeCanvas(){
  var wrap=document.getElementById("board-wrap"),rect=wrap.getBoundingClientRect(),size=Math.floor(rect.width);
  dpr=window.devicePixelRatio||1;canvas.width=size*dpr;canvas.height=size*dpr;
  canvas.style.width=size+"px";canvas.style.height=size+"px";
  CANVAS_SIZE=size;PADDING=CANVAS_SIZE*0.05;CELL_SIZE=(CANVAS_SIZE-2*PADDING)/(BOARD_SIZE-1);
  ctx.scale(dpr,dpr);drawBoard();
}
function drawBoard(){
  var s=CANVAS_SIZE;ctx.clearRect(0,0,s,s);
  ctx.fillStyle="#daa84b";ctx.fillRect(0,0,s,s);
  ctx.save();ctx.globalAlpha=0.04;
  for(var i=0;i<60;i++){ctx.beginPath();ctx.moveTo(Math.random()*s,0);ctx.lineTo(Math.random()*s,s);ctx.strokeStyle="#5a3a1a";ctx.lineWidth=Math.random()*2+0.5;ctx.stroke()}
  ctx.restore();
  ctx.strokeStyle="#5a3a1a";ctx.lineWidth=0.8;
  for(var i=0;i<BOARD_SIZE;i++){var p=PADDING+i*CELL_SIZE;ctx.beginPath();ctx.moveTo(PADDING,p);ctx.lineTo(PADDING+(BOARD_SIZE-1)*CELL_SIZE,p);ctx.stroke();ctx.beginPath();ctx.moveTo(p,PADDING);ctx.lineTo(p,PADDING+(BOARD_SIZE-1)*CELL_SIZE);ctx.stroke()}
  var stars=[[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
  for(var si=0;si<stars.length;si++){var r=stars[si][0],c=stars[si][1];var x=PADDING+c*CELL_SIZE,y=PADDING+r*CELL_SIZE;ctx.beginPath();ctx.arc(x,y,CELL_SIZE*0.12,0,Math.PI*2);ctx.fillStyle="#5a3a1a";ctx.fill()}
  if(winningCells.length>0){ctx.save();for(var wi=0;wi<winningCells.length;wi++){var wr=winningCells[wi][0],wc=winningCells[wi][1];ctx.beginPath();ctx.arc(PADDING+wc*CELL_SIZE,PADDING+wr*CELL_SIZE,CELL_SIZE*0.5,0,Math.PI*2);ctx.fillStyle="rgba(255,215,0,0.18)";ctx.fill()}ctx.restore()}
  for(var r=0;r<BOARD_SIZE;r++)for(var c=0;c<BOARD_SIZE;c++)if(board[r][c]!==EMPTY)drawStone(r,c,board[r][c]);
  if(lastMove){var lx=PADDING+lastMove.c*CELL_SIZE,ly=PADDING+lastMove.r*CELL_SIZE;ctx.beginPath();ctx.arc(lx,ly,CELL_SIZE*0.1,0,Math.PI*2);ctx.fillStyle="#ff4444";ctx.fill();ctx.beginPath();ctx.arc(lx,ly,CELL_SIZE*0.18,0,Math.PI*2);ctx.fillStyle="rgba(255,68,68,0.2)";ctx.fill()}
  ctx.strokeStyle="#3a2210";ctx.lineWidth=2;ctx.strokeRect(0,0,s,s);
}
function drawStone(row,col,player){
  var x=PADDING+col*CELL_SIZE,y=PADDING+row*CELL_SIZE,r=CELL_SIZE*0.42;ctx.save();
  ctx.beginPath();ctx.arc(x+1.5,y+2,r,0,Math.PI*2);ctx.fillStyle="rgba(0,0,0,0.25)";ctx.fill();
  if(player===BLACK){var g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);g.addColorStop(0,"#666");g.addColorStop(0.6,"#2a2a2a");g.addColorStop(1,"#111");ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="rgba(0,0,0,0.3)";ctx.lineWidth=0.5;ctx.stroke()}
  else{var g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);g.addColorStop(0,"#fff");g.addColorStop(0.7,"#f0f0f0");g.addColorStop(1,"#d0d0d0");ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="rgba(0,0,0,0.15)";ctx.lineWidth=0.5;ctx.stroke()}
  ctx.restore();
}
function placeStone(row,col){
  if(gameOver||row<0||row>=BOARD_SIZE||col<0||col>=BOARD_SIZE||board[row][col]!==EMPTY)return false;
  board[row][col]=currentPlayer;history.push({player:currentPlayer,row:row,col:col});lastMove={r:row,c:col};drawBoard();
  if(checkWin(row,col,currentPlayer)){gameOver=true;winner=currentPlayer;if(winner===BLACK)blackScore++;else whiteScore++;updateUI();drawBoard();showWin();return true}
  if(history.length===BOARD_SIZE*BOARD_SIZE){gameOver=true;updateUI();showToast("平局！棋盘已满","info");return true}
  if(doubleMove&&currentPlayer===BLACK&&!doubleMovePending){doubleMovePending=true;updateUI();return true}
  doubleMovePending=false;switchTurn();updateUI();return true;
}
function switchTurn(){currentPlayer=currentPlayer===BLACK?WHITE:BLACK}
function checkWin(row,col,player){
  var dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(var di=0;di<dirs.length;di++){var dr=dirs[di][0],dc=dirs[di][1];var cells=[[row,col]];var r=row+dr,c=col+dc;while(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===player){cells.push([r,c]);r+=dr;c+=dc}r=row-dr;c=col-dc;while(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===player){cells.push([r,c]);r-=dr;c-=dc}if(cells.length>=5){winningCells=cells;return true}}
  return false;
}
function undo(){
  if(history.length===0)return;
  if(gameOver&&winner){if(winner===BLACK&&blackScore>0)blackScore--;if(winner===WHITE&&whiteScore>0)whiteScore--}
  var m=history.pop();board[m.row][m.col]=EMPTY;lastMove=history.length>0?{r:history[history.length-1].row,c:history[history.length-1].col}:null;currentPlayer=m.player;
  if(doubleMovePending)doubleMovePending=false;gameOver=false;winner=null;winningCells=[];updateUI();drawBoard();
}
function removeOpponentLast(){
  if(history.length<2){showToast("还没有对手的棋子可以移除","warn");return}
  var opp=currentPlayer,idx=history.length-1;while(idx>=0&&history[idx].player!==opp)idx--;
  if(idx<0){showToast("没有找到对手的棋子","warn");return}
  var t=history[idx];board[t.row][t.col]=EMPTY;history.splice(idx,1);
  lastMove=history.length>0?{r:history[history.length-1].row,c:history[history.length-1].col}:null;
  if(gameOver){gameOver=false;winner=null;winningCells=[]}doubleMovePending=false;
  showToast("已移除对手一枚棋子 👑","success");updateUI();drawBoard();
}
function swapColors(){
  for(var r=0;r<BOARD_SIZE;r++)for(var c=0;c<BOARD_SIZE;c++){if(board[r][c]===BLACK)board[r][c]=WHITE;else if(board[r][c]===WHITE)board[r][c]=BLACK}
  currentPlayer=currentPlayer===BLACK?WHITE:BLACK;winningCells=[];doubleMovePending=false;
  if(gameOver){var t=blackScore;blackScore=whiteScore;whiteScore=t;winner=winner===BLACK?WHITE:BLACK}
  showToast("棋盘颜色已交换 🔄","info");updateUI();drawBoard();
}
function getAiMove(){
  if(gameOver)return null;var candidates=new Map();
  for(var r=0;r<BOARD_SIZE;r++)for(var c=0;c<BOARD_SIZE;c++)if(board[r][c]!==EMPTY)for(var dr=-2;dr<=2;dr++)for(var dc=-2;dc<=2;dc++){var nr=r+dr,nc=c+dc;if(nr>=0&&nr<BOARD_SIZE&&nc>=0&&nc<BOARD_SIZE&&board[nr][nc]===EMPTY){var k=nr*BOARD_SIZE+nc;if(!candidates.has(k))candidates.set(k,{r:nr,c:nc})}}
  if(candidates.size===0)return{r:Math.floor(BOARD_SIZE/2),c:Math.floor(BOARD_SIZE/2)}
  var best=-Infinity,bestMove=null;
  Array.from(candidates.values()).forEach(function(cell){var sc=evaluatePosition(cell.r,cell.c,currentPlayer)*1+evaluatePosition(cell.r,cell.c,currentPlayer===BLACK?WHITE:BLACK)*1.1+(14-(Math.abs(cell.r-7)+Math.abs(cell.c-7)))*0.5;if(sc>best){best=sc;bestMove=cell}})
  return bestMove;
}
function evaluatePosition(row,col,player){
  var dirs=[[1,0],[0,1],[1,1],[1,-1]],total=0;
  for(var di=0;di<dirs.length;di++){var dr=dirs[di][0],dc=dirs[di][1];var cnt=1,open=0;var r=row+dr,c=col+dc;while(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===player){cnt++;r+=dr;c+=dc}if(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===EMPTY)open++;r=row-dr;c=col-dc;while(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===player){cnt++;r-=dr;c-=dc}if(r>=0&&r<BOARD_SIZE&&c>=0&&c<BOARD_SIZE&&board[r][c]===EMPTY)open++;total+=patternScore(cnt,open)}
  return total;
}
function patternScore(cnt,open){if(cnt>=5)return 100000;if(open===0)return 0;switch(cnt){case 4:return open===2?10000:1000;case 3:return open===2?1000:100;case 2:return open===2?100:10;case 1:return open===2?10:1;default:return 0}}
function aiPlay(){
  if(gameOver){showToast("游戏已结束，请重新开始","warn");return}
  var m=getAiMove();if(!m)return;placeStone(m.r,m.c);
  if(doubleMove&&doubleMovePending&&currentPlayer===BLACK&&!gameOver)setTimeout(function(){var m2=getAiMove();if(m2)placeStone(m2.r,m2.c)},300);
}
function updateUI(){
  if(gameOver){if(winner===BLACK){turnDot.className="turn-dot black";turnText.textContent="黑棋获胜！"}else if(winner===WHITE){turnDot.className="turn-dot white";turnText.textContent="白棋获胜！"}else{turnDot.className="turn-dot";turnText.textContent="平局！"}}
  else{turnDot.className="turn-dot "+(currentPlayer===BLACK?"black":"white");var l=currentPlayer===BLACK?"黑棋走":"白棋走";if(doubleMove&&doubleMovePending&&currentPlayer===BLACK)l="黑棋走 (还差一子)";turnText.textContent=l}
  scoreBlack.textContent=blackScore;scoreWhite.textContent=whiteScore;btnUndo.disabled=history.length===0;
  godAi.disabled=gameOver||history.length===0;godRemove.disabled=history.length<2;godDouble.classList.toggle("active",doubleMove);godDouble.textContent=doubleMove?"🔁 双倍落子 (开)":"🔁 双倍落子";
}
function showWin(){if(winner===BLACK){winEmoji.textContent="🎉";winText.textContent="黑棋获胜！";winSub.textContent="再来一局吧 ✨"}else{winEmoji.textContent="🎉";winText.textContent="白棋获胜！";winSub.textContent="再来一局吧 ✨"}winOverlay.classList.add("show")}
function showToast(msg,type){toast.textContent=msg;toast.className="show "+(type||"");clearTimeout(toast._timer);toast._timer=setTimeout(function(){toast.classList.remove("show")},2200)}
function handleBoardClick(e){if(gameOver)return;var r=canvas.getBoundingClientRect();var x=(e.clientX-r.left)*(CANVAS_SIZE/r.width),y=(e.clientY-r.top)*(CANVAS_SIZE/r.height);var col=Math.round((x-PADDING)/CELL_SIZE),row=Math.round((y-PADDING)/CELL_SIZE);if(row<0||row>=BOARD_SIZE||col<0||col>=BOARD_SIZE)return;placeStone(row,col)}
function handleBoardTouch(e){e.preventDefault();if(gameOver)return;var t=e.touches[0];if(!t)return;var r=canvas.getBoundingClientRect();var x=(t.clientX-r.left)*(CANVAS_SIZE/r.width),y=(t.clientY-r.top)*(CANVAS_SIZE/r.height);var col=Math.round((x-PADDING)/CELL_SIZE),row=Math.round((y-PADDING)/CELL_SIZE);if(row<0||row>=BOARD_SIZE||col<0||col>=BOARD_SIZE)return;placeStone(row,col)}
gameTitle.addEventListener("click",function(){if(wasGodUnlocked)return;titleClicks++;clearTimeout(titleClickTimer);if(titleClicks>=5){wasGodUnlocked=true;godMode=true;godPanel.classList.add("open");showToast("👑 上帝模式已激活！","success");godHint.textContent="👑 上帝模式已开启 (Ctrl+G 切换)";updateUI();return}titleClickTimer=setTimeout(function(){titleClicks=0},1200);if(titleClicks<5){var r=5-titleClicks;if(r<=2)showToast("再点击 "+r+" 次解锁隐藏模式","info")}})
document.addEventListener("keydown",function(e){if(e.ctrlKey&&e.key==="g"){e.preventDefault();if(wasGodUnlocked){godMode=!godMode;godPanel.classList.toggle("open",godMode);showToast(godMode?"👑 上帝模式已开启":"上帝模式已关闭",godMode?"success":"info")}else showToast("🔑 试试连击标题","info")}})
btnRestart.addEventListener("click",function(){initBoard();winOverlay.classList.remove("show")})
btnUndo.addEventListener("click",undo)
winRestart.addEventListener("click",function(){initBoard();winOverlay.classList.remove("show")})
godAi.addEventListener("click",aiPlay)
godDouble.addEventListener("click",function(){doubleMove=!doubleMove;if(!doubleMove)doubleMovePending=false;updateUI();showToast(doubleMove?"双倍落子已开启 🔁":"双倍落子已关闭",doubleMove?"success":"info")})
godRemove.addEventListener("click",removeOpponentLast)
godSwap.addEventListener("click",swapColors)
winOverlay.addEventListener("click",function(e){if(e.target===winOverlay)winOverlay.classList.remove("show")})
canvas.addEventListener("click",handleBoardClick);canvas.addEventListener("touchstart",handleBoardTouch,{passive:false})
var resizeTimer;window.addEventListener("resize",function(){clearTimeout(resizeTimer);resizeTimer=setTimeout(resizeCanvas,150)})
function init(){initBoard();requestAnimationFrame(function(){requestAnimationFrame(resizeCanvas)})}
init();
</script>
</body>
</html>
