<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>五子棋 · 萌宠对战</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ===== Lobby ===== -->
  <div id="lobby">
    <h1>🎮 五子棋</h1>
    <div class="sub">和好姐妹一起玩吧 ✨</div>

    <div class="char-select">
      <div class="label">选择你的角色</div>
      <div class="char-options">
        <div class="char-card selected" data-idx="0">
          <span class="emoji">😺</span>
          <div class="name">元气猫猫</div>
        </div>
        <div class="char-card" data-idx="1">
          <span class="emoji">🐶</span>
          <div class="name">发呆汪汪</div>
        </div>
        <div class="char-card" data-idx="2">
          <span class="emoji">🐰</span>
          <div class="name">傲娇兔兔</div>
        </div>
      </div>
    </div>

    <div class="lobby-btns">
      <button id="btnCreate" class="primary">🎮 创建房间</button>
      <button id="btnShowJoin" class="secondary">🔗 加入房间</button>
    </div>

    <div id="joinArea" style="display:none">
      <div class="join-row">
        <input id="roomInput" type="text" maxlength="4" placeholder="0000" autocomplete="off">
        <button id="btnJoin" class="primary" style="padding:10px 18px;font-size:14px">加入</button>
      </div>
    </div>

    <div id="roomDisplay" style="display:none">
      <div class="room-code-box">
        <div class="code" id="roomCodeText">0000</div>
        <div class="label">把房间号发给对方~</div>
      </div>
    </div>

    <div class="status-line" id="lobbyStatus">创建或加入一个房间开始游戏 🎯</div>

    <div id="startArea" style="display:none">
      <button id="btnStart" class="primary" style="padding:12px 36px;font-size:16px;margin-top:6px">
        🎯 开始游戏
      </button>
    </div>

    <footer>五子棋 · 萌宠对战</footer>
  </div>

  <!-- ===== Game ===== -->
  <div id="game" style="display:none">
    <div class="game-header">
      <h1 id="gameTitle">🏆 五子棋</h1>
      <span class="conn-badge" id="connBadge">🟡 连接中</span>
    </div>

    <div class="player-row">
      <div class="player-card" id="player1Card">
        <div id="p1Active">
          <span class="avatar" id="p1Avatar">😺</span>
          <div>
            <div class="pname" id="p1Name">我</div>
            <span class="pdot black" id="p1Dot"></span>
          </div>
        </div>
      </div>

      <span style="font-size:18px;opacity:0.3">⚔️</span>

      <div class="player-card" id="player2Card">
        <div id="p2Active">
          <span class="avatar" id="p2Avatar">🐶</span>
          <div>
            <div class="pname" id="p2Name">对手</div>
            <span class="pdot white" id="p2Dot"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="turn-text" id="turnText">等待开始...</div>

    <div id="boardWrap">
      <canvas id="board"></canvas>
    </div>

    <div class="control-btns">
      <button id="eggBtn">🥚 扔鸡蛋</button>
      <button id="restartBtn">🔄 再来一局</button>
      <button id="leaveBtn">🚪 退出</button>
    </div>

    <div class="taunt-input">
      <input id="tauntInput" type="text" placeholder="输入嘲讽..." maxlength="30">
      <button id="tauntSend">发送 💬</button>
    </div>

    <div id="godPanel">
      <div class="god-header">👑 上帝工具箱</div>
      <div class="god-btns">
        <button id="godDouble">🔁 连下多子</button>
        <button id="godAi">🤖 AI 帮下</button>
      </div>
    </div>

    <div style="text-align:right;margin-top:2px">
      <span class="god-indicator" id="godIndicator" style="display:none">✨ 上帝模式已激活</span>
    </div>
  </div>
</div>

<!-- ===== Win ===== -->
<div id="winOverlay">
  <div class="win-card">
    <span class="win-emoji" id="winEmoji">🎉</span>
    <div class="win-text" id="winText">你赢了！</div>
    <button id="winOk">好的 🎯</button>
  </div>
</div>

<!-- ===== Toast ===== -->
<div id="toast"></div>

<script src="client.js"></script>
</body>
</html>
